# Ejecuta las pruebas y genera el ejecutable para Windows y Linux
# cada vez que se sube código. El .exe queda en la pestaña "Actions"
# (sección Artifacts) y, si se crea una etiqueta v*, en "Releases".
name: Pruebas y ejecutable

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -t . -v

      - name: Instalar PyInstaller
        run: pip install pyinstaller

      - name: Generar ejecutable
        run: pyinstaller --onefile --console --name SistemaCalificaciones-${{ runner.os }} main.py

      - uses: actions/upload-artifact@v4
        with:
          name: SistemaCalificaciones-${{ runner.os }}
          path: dist/*

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
